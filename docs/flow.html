<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Animated Shallot request flow." />
    <title>Shallot flow</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f6f7fb;
        --panel: #ffffff;
        --ink: #17213c;
        --muted: #66708a;
        --line: #d9deeb;
        --device: #3157d5;
        --relay: #e5863b;
        --exit: #754bc4;
        --provider: #16866a;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background: var(--paper);
      }

      button {
        font: inherit;
      }

      .page {
        width: min(1400px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 24px;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 18px;
      }

      .control {
        min-width: 76px;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 8px 14px;
        color: var(--ink);
        background: var(--panel);
        cursor: pointer;
      }

      .control:hover {
        border-color: var(--device);
      }

      .control:focus-visible {
        outline: 3px solid rgba(49, 87, 213, 0.2);
        outline-offset: 2px;
      }

      .diagram {
        position: relative;
        overflow: clip;
      }

      .diagram::after {
        position: absolute;
        z-index: 0;
        top: 49%;
        right: 6%;
        left: 6%;
        height: 1px;
        background: var(--line);
        content: "";
      }

      .machines {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1.55fr 0.8fr 0.8fr 0.8fr;
        min-height: 510px;
        border-block: 1px solid var(--line);
      }

      .machine {
        --zone-color: var(--device);
        position: relative;
        display: flex;
        min-width: 0;
        flex-direction: column;
        padding: 18px 14px;
        border-right: 1px dashed var(--line);
      }

      .machine:last-child {
        border-right: 0;
      }

      .machine-label {
        color: var(--ink);
        font-size: 0.86rem;
        font-weight: 650;
      }

      .nodes {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        margin: auto 0;
      }

      .node {
        position: relative;
        display: grid;
        width: 118px;
        height: 70px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        font-size: 0.84rem;
        font-weight: 700;
        transition:
          border-color 180ms ease,
          box-shadow 180ms ease,
          transform 180ms ease;
      }

      .node.active {
        border-color: var(--zone-color);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--zone-color) 13%, transparent);
        transform: translateY(-3px);
      }

      .device-link {
        color: var(--line);
        font-family: "SFMono-Regular", Consolas, monospace;
      }

      .packet {
        position: absolute;
        z-index: 4;
        top: 0;
        left: 0;
        width: 290px;
        min-height: 104px;
        overflow: hidden;
        border: 1px solid rgba(23, 33, 60, 0.17);
        border-radius: 6px;
        color: var(--ink);
        background: #fff;
        box-shadow: 0 8px 22px rgba(23, 33, 60, 0.14);
        opacity: 0;
        transition:
          transform 760ms cubic-bezier(0.42, 0, 0.18, 1),
          opacity 160ms ease,
          background 180ms ease,
          color 180ms ease;
        pointer-events: none;
      }

      .packet.visible {
        opacity: 1;
      }

      .packet.sealed {
        border-color: #57627a;
        color: var(--ink);
        background: #f1f3f7;
      }

      .packet.response {
        border-color: color-mix(in srgb, var(--provider) 45%, var(--line));
        background: #f2fbf8;
      }

      .packet-head {
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 32px;
        padding: 7px 10px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 700;
      }

      .packet.sealed .packet-head {
        color: #fff;
        background: var(--ink);
      }

      .lock {
        display: none;
        width: 12px;
        height: 12px;
      }

      .packet.sealed .lock {
        display: block;
      }

      .packet-fields {
        margin: 0;
      }

      .packet-row {
        display: grid;
        grid-template-columns: 60px 1fr;
        gap: 8px;
        padding: 8px 10px;
      }

      .packet-row + .packet-row {
        border-top: 1px solid var(--line);
      }

      .packet-row dt,
      .packet-row dd {
        margin: 0;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.66rem;
        line-height: 1.4;
      }

      .packet-row dt {
        color: var(--muted);
      }

      .packet-row dd {
        overflow-wrap: anywhere;
        font-weight: 650;
      }

      .step-count {
        min-width: 52px;
        color: var(--muted);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 0.72rem;
        text-align: center;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      @media (max-width: 820px) {
        .page {
          width: min(100% - 20px, 560px);
          padding-top: 18px;
        }

        .diagram::after {
          display: none;
        }

        .machines {
          grid-template-columns: 1fr;
        }

        .machine {
          min-height: 190px;
          border-right: 0;
          border-bottom: 1px dashed var(--line);
        }

        .machine:last-child {
          border-bottom: 0;
        }

        .packet {
          width: min(290px, calc(100% - 24px));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .packet,
        .node {
          transition-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="diagram" id="diagram" aria-label="Animated Shallot request flow">
        <div class="machines">
          <section class="machine" style="--zone-color: var(--device)">
            <div class="machine-label">Device</div>
            <div class="nodes">
              <div class="node" id="app-node">AI SDK</div>
              <span class="device-link" aria-hidden="true">→</span>
              <div class="node" id="sidecar-node">Sidecar</div>
            </div>
          </section>

          <section class="machine" style="--zone-color: var(--relay)">
            <div class="machine-label">Relay host</div>
            <div class="nodes">
              <div class="node" id="relay-node">Relay</div>
            </div>
          </section>

          <section class="machine" style="--zone-color: var(--exit)">
            <div class="machine-label">Exit host</div>
            <div class="nodes">
              <div class="node" id="exit-node">Exit</div>
            </div>
          </section>

          <section class="machine" style="--zone-color: var(--provider)">
            <div class="machine-label">Provider</div>
            <div class="nodes">
              <div class="node" id="provider-node">Model</div>
            </div>
          </section>
        </div>

        <div class="packet" id="packet" aria-hidden="true">
          <div class="packet-head">
            <svg class="lock" viewBox="0 0 16 16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M4.5 7V5a3.5 3.5 0 1 1 7 0v2H13v8H3V7h1.5Zm1.25 0h4.5V5a2.25 2.25 0 0 0-4.5 0v2Z"
              />
            </svg>
            <span id="packet-title"></span>
          </div>
          <dl class="packet-fields">
            <div class="packet-row">
              <dt id="field-one-label"></dt>
              <dd id="field-one-value"></dd>
            </div>
            <div class="packet-row">
              <dt id="field-two-label"></dt>
              <dd id="field-two-value"></dd>
            </div>
          </dl>
        </div>
      </section>

      <nav class="controls" aria-label="Animation controls">
        <button class="control" id="previous" type="button">Previous</button>
        <span class="step-count" id="step-count">1 / 10</span>
        <button class="control" id="toggle" type="button">Pause</button>
        <button class="control" id="next" type="button">Next</button>
      </nav>

      <p class="sr-only" id="announcer" aria-live="polite"></p>
    </main>

    <script>
      const steps = [
        {
          node: "app-node",
          title: "Request",
          fields: [
            ["Prompt", '"Summarize the Q3 roadmap."'],
            ["User", "Alice"],
          ],
          kind: "plain",
        },
        {
          node: "sidecar-node",
          title: "Encrypted request",
          fields: [
            ["Prompt", "Encrypted for Exit"],
            ["User", "Alice"],
          ],
          kind: "sealed",
        },
        {
          node: "relay-node",
          title: "Encrypted request",
          fields: [
            ["Prompt", "Encrypted for Exit"],
            ["User", "Alice"],
          ],
          kind: "sealed",
        },
        {
          node: "exit-node",
          title: "Decrypted request",
          fields: [
            ["Prompt", '"Summarize the Q3 roadmap."'],
            ["User", "Not sent"],
          ],
          kind: "plain",
        },
        {
          node: "provider-node",
          title: "Provider request",
          fields: [
            ["Prompt", '"Summarize the Q3 roadmap."'],
            ["User", "Not sent"],
          ],
          kind: "plain",
        },
        {
          node: "exit-node",
          title: "Provider response",
          fields: [
            ["Answer", '"Q3: ship the API, audit logs, and SSO."'],
            ["User", "Not sent"],
          ],
          kind: "response",
        },
        {
          node: "exit-node",
          title: "Encrypted response",
          fields: [
            ["Answer", "Encrypted for Sidecar"],
            ["User", "Not sent"],
          ],
          kind: "sealed",
        },
        {
          node: "relay-node",
          title: "Encrypted response",
          fields: [
            ["Answer", "Encrypted for Sidecar"],
            ["User", "Alice"],
          ],
          kind: "sealed",
        },
        {
          node: "sidecar-node",
          title: "Decrypted response",
          fields: [
            ["Answer", '"Q3: ship the API, audit logs, and SSO."'],
            ["User", "Alice"],
          ],
          kind: "response",
        },
        {
          node: "app-node",
          title: "Response",
          fields: [
            ["Answer", '"Q3: ship the API, audit logs, and SSO."'],
            ["User", "Alice"],
          ],
          kind: "response",
        },
      ];

      const diagram = document.querySelector("#diagram");
      const packet = document.querySelector("#packet");
      const packetTitle = document.querySelector("#packet-title");
      const fieldOneLabel = document.querySelector("#field-one-label");
      const fieldOneValue = document.querySelector("#field-one-value");
      const fieldTwoLabel = document.querySelector("#field-two-label");
      const fieldTwoValue = document.querySelector("#field-two-value");
      const announcer = document.querySelector("#announcer");
      const toggle = document.querySelector("#toggle");
      const previous = document.querySelector("#previous");
      const next = document.querySelector("#next");
      const stepCount = document.querySelector("#step-count");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      let activeStep = 0;
      let playing = !reducedMotion.matches;
      let timer;
      toggle.textContent = playing ? "Pause" : "Play";

      function positionPacket(node) {
        const diagramRect = diagram.getBoundingClientRect();
        const nodeRect = node.getBoundingClientRect();
        const x = nodeRect.left - diagramRect.left + nodeRect.width / 2 - packet.offsetWidth / 2;
        const y = nodeRect.top - diagramRect.top + nodeRect.height + 24;
        const boundedX = Math.min(
          diagramRect.width - packet.offsetWidth - 10,
          Math.max(10, x),
        );
        packet.style.transform = `translate(${boundedX}px, ${y}px)`;
      }

      function showStep(index, announce = true) {
        activeStep = (index + steps.length) % steps.length;
        const step = steps[activeStep];
        const node = document.querySelector(`#${step.node}`);

        document.querySelectorAll(".node.active").forEach((item) => {
          item.classList.remove("active");
        });
        node.classList.add("active");
        packet.className = `packet visible ${step.kind}`;
        packetTitle.textContent = step.title;
        fieldOneLabel.textContent = step.fields[0][0];
        fieldOneValue.textContent = step.fields[0][1];
        fieldTwoLabel.textContent = step.fields[1][0];
        fieldTwoValue.textContent = step.fields[1][1];
        stepCount.textContent = `${activeStep + 1} / ${steps.length}`;
        positionPacket(node);
        if (announce) {
          announcer.textContent = `${step.title}. ${step.fields[0].join(": ")}. ${step.fields[1].join(": ")}.`;
        }
      }

      function schedule() {
        clearTimeout(timer);
        if (!playing) return;
        timer = setTimeout(() => {
          showStep(activeStep + 1);
          schedule();
        }, 2400);
      }

      toggle.addEventListener("click", () => {
        playing = !playing;
        toggle.textContent = playing ? "Pause" : "Play";
        schedule();
      });

      function moveManually(offset) {
        playing = false;
        toggle.textContent = "Play";
        clearTimeout(timer);
        showStep(activeStep + offset);
      }

      previous.addEventListener("click", () => moveManually(-1));
      next.addEventListener("click", () => moveManually(1));

      reducedMotion.addEventListener("change", (event) => {
        playing = !event.matches;
        toggle.textContent = playing ? "Pause" : "Play";
        schedule();
      });

      window.addEventListener("resize", () => {
        const step = steps[activeStep];
        positionPacket(document.querySelector(`#${step.node}`));
      });

      showStep(0, false);
      schedule();
    </script>
  </body>
</html>
